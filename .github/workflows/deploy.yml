name: Deploy to EC2

on:
  push:
    branches:
      - main   # change to master if your default branch is master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/html

            if [ ! -d ".git" ]; then
              git clone https://github.com/bhargesh007/freamus.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # Stop old container
            docker stop freamus-container || true
            docker rm freamus-container || true

            # Build new image
            docker build -t freamus-image .

            # Run container
            docker run -d \
              -p 80:80 \
              --name freamus-container \
              --restart always \
              freamus-image

